<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">SynCRAG-skill</title>
  <desc id="desc">部署网站的真实 README 问题，经合成问法构建的索引映射到部署技能；索引条目为机制示例。</desc>
  <defs>
    <clipPath id="canvas">
      <rect width="1200" height="650" rx="26" />
    </clipPath>
  </defs>
  <g clip-path="url(#canvas)">
    <rect x="0" y="0" width="1200" height="650" rx="0" fill="#112F2B" />
    <text x="50" y="42" font-family="Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#BADA94">SYNTHETIC QUERIES / DENSE RETRIEVAL</text>
    <text x="46" y="120" font-family="Georgia, Songti SC, serif" font-size="78" font-weight="500" fill="#F1F1DF">SynCRAG-skill</text>
    <text x="53" y="166" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Hiragino Sans, sans-serif" font-size="31" font-weight="400" fill="#A7C1AA">把用户的问法，提前写进索引。</text>
    <path d="M51 198 H1147" fill="none" stroke="#47665B" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
    <text x="51" y="242" font-family="Menlo, Consolas, monospace" font-size="18" font-weight="500" fill="#BADA94">USER LANGUAGE</text>
    <text x="51" y="301" font-family="Georgia, Songti SC, serif" font-size="34" font-weight="400" fill="#F1F1DF">“How do I get</text>
    <text x="52" y="350" font-family="Georgia, Songti SC, serif" font-size="34" font-weight="400" fill="#F1F1DF">my website online?”</text>
    <text x="53" y="398" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Hiragino Sans, sans-serif" font-size="18" font-weight="400" fill="#A7C1AA">README 中的检索例子</text>
    <rect x="438" y="258" width="364" height="269" rx="5" fill="#426148" />
    <rect x="425" y="245" width="364" height="269" rx="5" fill="#EAF0DB" />
    <rect x="453" y="224" width="150" height="32" rx="3" fill="#BADA94" />
    <text x="471" y="247" font-family="Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#112F2B">INDEX</text>
    <text x="449" y="299" font-family="Georgia, Songti SC, serif" font-size="23" font-weight="400" fill="#2D4B38">publish my site</text>
    <path d="M449 314 H764" fill="none" stroke="#BECDAA" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
    <text x="449" y="360" font-family="Georgia, Songti SC, serif" font-size="23" font-weight="400" fill="#2D4B38">deploy a website</text>
    <path d="M449 375 H764" fill="none" stroke="#BECDAA" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
    <text x="449" y="421" font-family="Georgia, Songti SC, serif" font-size="23" font-weight="400" fill="#2D4B38">put my app online</text>
    <path d="M449 436 H764" fill="none" stroke="#BECDAA" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
    <text x="449" y="489" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Hiragino Sans, sans-serif" font-size="18" font-weight="400" fill="#6E8469">合成问法示意</text>
    <text x="875" y="279" font-family="Menlo, Consolas, monospace" font-size="18" font-weight="500" fill="#BADA94">MATCHED SKILL</text>
    <text x="872" y="332" font-family="Georgia, Songti SC, serif" font-size="43" font-weight="500" fill="#F1F1DF">Vercel</text>
    <text x="874" y="373" font-family="Georgia, Songti SC, serif" font-size="32" font-weight="400" fill="#F1F1DF">deployment</text>
    <text x="875" y="416" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Hiragino Sans, sans-serif" font-size="25" font-weight="400" fill="#A7C1AA">部署工作流</text>
    <text x="50" y="574" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Hiragino Sans, sans-serif" font-size="25" font-weight="400" fill="#F1F1DF">构建索引时：语义重建</text>
    <text x="651" y="574" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Hiragino Sans, sans-serif" font-size="25" font-weight="400" fill="#F1F1DF">查询时：向量匹配</text>
    <text x="50" y="614" font-family="Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#A7C1AA">Skill descriptions → synthetic queries → multi-vector index</text>
    <g id="semantic-match">
