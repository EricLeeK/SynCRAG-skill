<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">SynCRAG-skill</title>
  <desc id="desc">Build a synthetic-query index once; retrieve skills with dense vectors at query time. The diagram is a conceptual illustration, not a benchmark or application screenshot.</desc>
  <defs>
    <clipPath id="frame">
      <rect width="1200" height="440" rx="24" />
    </clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect x="0" y="0" width="1200" height="440" rx="24" fill="#102c27" />
    <text x="60" y="72" font-family="'SFMono-Regular',Menlo,monospace" font-size="18" font-weight="600" fill="#b7d985" text-anchor="start">SYNTHETIC QUERY RETRIEVAL</text>
    <text x="60" y="166" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="74" font-weight="700" fill="#edf4e6" text-anchor="start">SynCRAG</text>
    <text x="60" y="244" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="74" font-weight="700" fill="#edf4e6" text-anchor="start">skill</text>
    <text x="60" y="298" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="26" font-weight="400" fill="#edf4e6" text-anchor="start">Reconstruct meaning once.</text>
    <text x="60" y="333" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="26" font-weight="400" fill="#edf4e6" text-anchor="start">Retrieve with vectors.</text>
    <text x="60" y="400" font-family="'SFMono-Regular',Menlo,monospace" font-size="18" font-weight="600" fill="#b7d985" text-anchor="start">LLM AT INDEX TIME  /  DENSE RETRIEVAL AT RUNTIME</text>
    <path d="M686 226H1134" fill="none" stroke="#467564" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="687" y="70" font-family="'SFMono-Regular',Menlo,monospace" font-size="18" font-weight="600" fill="#b7d985" text-anchor="start">01  INDEX BUILDING</text>
    <g id="index">
      <rect x="680" y="100" width="193" height="82" rx="7" fill="#264a3d" />
      <text x="700" y="135" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="22" font-weight="500" fill="#edf4e6" text-anchor="start">Skill descriptions</text>
      <text x="700" y="165" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="20" font-weight="500" fill="#b7d985" text-anchor="start">+ synthetic queries</text>
      <path d="M885 141 L926 141" fill="none" stroke="#b7d985" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M917.5 146.2 L926 141 L917.5 135.8" fill="none" stroke="#b7d985" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="940" y="100" width="190" height="82" rx="7" fill="#b7d985" />
      <text x="964" y="150" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="24" font-weight="650" fill="#102c27" text-anchor="start">Vector index</text>
    </g>
    <text x="686" y="273" font-family="'SFMono-Regular',Menlo,monospace" font-size="18" font-weight="600" fill="#b7d985" text-anchor="start">02  RUNTIME LOOKUP</text>
    <g id="query">
      <text x="686" y="328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="27" font-weight="500" fill="#edf4e6" text-anchor="start">User query</text>
      <path d="M845 319 L922 319" fill="none" stroke="#b7d985" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M913.5 324.2 L922 319 L913.5 313.8" fill="none" stroke="#b7d985" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <g id="ranked-skills">
      <rect x="940" y="288" width="190" height="90" rx="7" fill="#edf4e6" />
      <text x="963" y="323" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="25" font-weight="650" fill="#102c27" text-anchor="start">Top-k skills</text>
      <path d="M965 348H1025M1044 348H1100" fill="none" stroke="#507951" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>
